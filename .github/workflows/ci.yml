name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:tarball
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-atn-${{ matrix.os }}
          path: .artifacts/*.tgz
  sidebar-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        provider: [published, upstream]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: matrix.provider == 'upstream'
        with:
          repository: omdsh-dev/DSH-better-sidebar
          ref: 83faf70940160e5cd4c5332f5400aa8f4dbbb6d6
          path: .scratch/sidebar-source
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Check both the 0.28.0 npm artifact and the pinned upstream source graph.
      # This isolated provider install supplies registry code, not the host runtime.
      - if: matrix.provider == 'published'
        run: npm install --prefix "${{ runner.temp }}/atn-sidebar-provider" --ignore-scripts --legacy-peer-deps --package-lock=false --no-audit --no-fund --save=false dsh-better-sidebar@0.28.0
      - run: npm run verify:sidebar
        env:
          SIDEBAR_PACKAGE_DIR: ${{ matrix.provider == 'upstream' && format('{0}/.scratch/sidebar-source', github.workspace) || format('{0}/atn-sidebar-provider/node_modules/dsh-better-sidebar', runner.temp) }}
